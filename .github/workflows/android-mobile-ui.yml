name: Android mobile UI and surface policy (no native game)
on:
  workflow_dispatch:
  push:
    branches: [android/direct-boot-60fps]
    paths: ['android/app/src/main/java/**', 'android/tests/ui/**', 'android/tools/ui_probe.py', '.github/workflows/android-mobile-ui.yml']
permissions:
  contents: read
jobs:
  mobile-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: python3 android/tools/ui_probe.py build
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 android/tools/ui_probe.py run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-ui-evidence-only
          path: ui-probe/evidence/
          retention-days: 3
