name: Split prepared Android toolchain
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful Android toolchain run
        required: true
        default: '36280116059'
  push:
    branches: [android/direct-boot-60fps]
    paths: [.github/workflows/android-toolchain-transfer.yml]
permissions:
  contents: read
  actions: read
jobs:
  split:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cbfd-android-toolchain
          run-id: ${{ inputs.source_run || '36280116059' }}
          github-token: ${{ github.token }}
          path: input
      - name: Split for bounded-size local transfer
        run: |
          mkdir -p output
          sha256sum input/cbfd-android-toolchain.tar.gz > output/complete.sha256
          split -b 250M -d input/cbfd-android-toolchain.tar.gz output/toolchain.part
          cd output && sha256sum toolchain.part* > parts.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: cbfd-toolchain-part00
          path: output/toolchain.part00
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: cbfd-toolchain-part01
          path: output/toolchain.part01
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: cbfd-toolchain-part02
          path: output/toolchain.part02
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: cbfd-toolchain-checksums
          path: output/*.sha256
          retention-days: 1
